name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: moon fmt --check
      - run: moon check --deny-warn --target all
      - run: moon build
      - run: moon test --deny-warn --target all
      - run: moon test --deny-warn --target all ./fixtures/constraints
      - run: moon test --deny-warn --target all ./fixtures/contains
      - run: moon test --deny-warn --target all ./fixtures/precision
      - run: moon test --deny-warn --target all ./fixtures/timestamps
      - run: moon test --deny-warn --target all ./fixtures/ieee754
      - run: moon test --deny-warn --target all ./fixtures/regex
      - run: moon test --deny-warn --target all ./fixtures/annotations
      - run: moon test --deny-warn --target all ./fixtures/all_of
      - run: moon run --target native ./cli fixtures/precision/precision.isl fixtures/precision/generated.mbt
      - run: moon run --target native ./cli fixtures/timestamps/timestamps.isl fixtures/timestamps/generated.mbt
      - run: moon run --target native ./cli fixtures/ieee754/ieee754.isl fixtures/ieee754/generated.mbt
      - run: moon run --target native ./cli fixtures/regex/regex.isl fixtures/regex/generated.mbt
      - run: moon run --target native ./cli fixtures/annotations/annotations.isl fixtures/annotations/generated.mbt
      - run: moon run --target native ./cli fixtures/all_of/all_of.isl fixtures/all_of/generated.mbt
      - run: moon run --target native ./cli fixtures/contains/contains.isl fixtures/contains/generated.mbt
      - run: moon run --target native ./cli fixtures/constraints/constraints.isl fixtures/constraints/generated.mbt
      - run: moon run --target native ./cli fixtures/references/references.isl fixtures/references/generated.mbt
      - run: moon run --target native ./cli examples/person/person.isl examples/person/generated.mbt
      - run: moon fmt
      - run: git diff --exit-code -- examples/person/generated.mbt fixtures/references/generated.mbt fixtures/constraints/generated.mbt fixtures/contains/generated.mbt fixtures/precision/generated.mbt fixtures/timestamps/generated.mbt fixtures/ieee754/generated.mbt fixtures/regex/generated.mbt fixtures/annotations/generated.mbt fixtures/all_of/generated.mbt
      - run: moon run --target native ./examples/person
